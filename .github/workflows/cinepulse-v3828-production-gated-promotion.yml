name: CinePulse v3.8.28 guarded production bridge promotion
on:
  push:
    branches: [feature/scene-intelligence-v3828-staging]
    paths:
      - '.github/workflows/cinepulse-v3828-production-gated-promotion.yml'
      - 'cloudflare/cinepulse-android/src/index.mjs'
      - 'cloudflare/cinepulse-android/src/v5g-production-gate.mjs'
      - 'cloudflare/cinepulse-android/src/v5g-match-plan.mjs'
      - 'cloudflare/cinepulse-android/src/bfg-v5-grounded-restart.mjs'
      - 'cloudflare/cinepulse-android/src/srt-interval-context.mjs'
      - 'cloudflare/cinepulse-android/tests/v5g-*.test.mjs'
      - 'cloudflare/cinepulse-android/src/longform-policy.mjs'
      - 'cloudflare/cinepulse-android/src/muse-production-contract.mjs'
      - 'cloudflare/cinepulse-android/tests/cutplan-srt-diagnostics.test.mjs'
      - 'cloudflare/cinepulse-android/src/server-cut-planner.mjs'
      - 'cloudflare/cinepulse-android/tests/server-export.test.mjs'
      - 'cloudflare/cinepulse-android/src/experimental-muse-instructions.mjs'
      - 'cloudflare/cinepulse-android/src/scene-lab.mjs'
      - 'cloudflare/cinepulse-android/src/scene-lab-runtime.mjs'
      - 'cloudflare/cinepulse-android/src/scene-lab-deep.mjs'
      - 'cloudflare/cinepulse-android/src/scene-lab-deep-candidates.mjs'
      - 'cloudflare/cinepulse-android/src/permanent-deep-muse.mjs'
      - 'cloudflare/cinepulse-android/src/permanent-deep-rematch.mjs'
      - 'cloudflare/cinepulse-android/tests/permanent-deep-rematch.test.mjs'
      - 'cloudflare/cinepulse-android/src/narration-duration-policy.mjs'
      - 'cloudflare/cinepulse-android/src/audio-urdu-quality.mjs'
      - 'cloudflare/cinepulse-android/src/urdu-devanagari-voice.mjs'
      - 'cloudflare/cinepulse-android/tests/urdu-devanagari-voice.test.mjs'
      - 'cloudflare/cinepulse-android/tests/audio-urdu-quality.test.mjs'
      - 'cloudflare/cinepulse-android/tests/urdu-anchor-duration-v51.test.mjs'
      - 'cloudflare/cinepulse-android/tests/permanent-deep-muse.test.mjs'
      - 'cloudflare/cinepulse-android/tests/scene-lab-deep-candidates.test.mjs'
      - 'cloudflare/cinepulse-android/tests/scene-lab-deep.test.mjs'
      - 'cloudflare/cinepulse-android/tools/scene_lab_deep_payload.py'
      - 'cloudflare/cinepulse-android/src/scene-lab-package.mjs'
      - 'cloudflare/cinepulse-android/tests/scene-lab*.test.mjs'
      - 'cloudflare/cinepulse-android/tools/scene_lab_extract.py'
      - 'cloudflare/cinepulse-android/tests/test_scene_lab_extract.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cinepulse-main-bridge-production-deploy
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: cloudflare/cinepulse-android
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CINEPULSE_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CINEPULSE_CF_ACCOUNT_ID }}
      PROD_ORIGIN: https://cinepulse-android-bridge.maryumblog.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current target, backup deployed version, verify live Worker health
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]
          node <<'NODE'
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('wrangler.json','utf8'));
          if(c.name!=='cinepulse-android-bridge'||c.main!=='src/index.mjs'||!c.keep_vars)
            throw Error('Unexpected production script or missing keep_vars');
          if(c.d1_databases?.[0]?.binding!=='DB'||c.r2_buckets?.[0]?.binding!=='FILES')
            throw Error('Production D1/R2 binding names changed');
          NODE
          curl -fsS --connect-timeout 12 --max-time 25 "$PROD_ORIGIN/health" > /tmp/cp-before-health.json
          jq -e '.status=="online" and .cloudOrigin==true and .policy.museOwnsCuts==true and .policy.windowsAssetCount==8' /tmp/cp-before-health.json >/dev/null
          curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/cinepulse-android-bridge/deployments" > /tmp/cp-before-deployments.json
          jq -e '.success==true' /tmp/cp-before-deployments.json >/dev/null
          jq -r '[.result.deployments[]?.versions[]? | select(.percentage==100) | .version_id][0] // empty' /tmp/cp-before-deployments.json > /tmp/cp-previous-id
          [[ "$(cat /tmp/cp-previous-id)" =~ ^[a-fA-F0-9-]{36}$ ]]
          echo 'BASELINE_PRODUCTION_VERSION_CAPTURED'
      - name: Install FFmpeg for mandatory real-audio extraction test
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "FFMPEG_AND_FFPROBE_ALREADY_PRESENT"
          else
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run all Cloudflare regressions and portable SQLite builder tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check src/index.mjs
          node --check src/scene-lab-runtime.mjs
          node --check src/scene-lab-deep.mjs
          node --check src/scene-lab-deep-candidates.mjs
          node --check src/permanent-deep-muse.mjs
          node --check src/permanent-deep-rematch.mjs
          node --check src/narration-duration-policy.mjs
          node --check src/audio-urdu-quality.mjs
          node --check src/urdu-devanagari-voice.mjs
          node --check src/scene-lab-package.mjs
          python3 -m py_compile tools/scene_lab_extract.py
          python3 -m py_compile tools/scene_lab_deep_payload.py
          python3 -m unittest discover -s tests -p 'test_scene_lab_extract.py' -v
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -p 'test_scene_sqlite.py' -v
          npx wrangler deploy --dry-run --config wrangler.json
          echo 'PRE_DEPLOY_TESTS_PASSED'
      - name: Deploy with guaranteed failure-triggered rollback and smoke tests
        shell: bash
        run: |
          set -euo pipefail
          previous=$(cat /tmp/cp-previous-id)
          deployed=0
          rollback_on_failure(){
            rc=$?
            if [[ "$rc" != "0" && "$deployed" == "1" ]]; then
              echo "::error::Production verification failed; reverting to preserved previous Worker version"
              npx wrangler rollback "$previous" --name cinepulse-android-bridge --message "CinePulse v3828 automatic rollback after failed health/auth check" || true
            fi
            exit "$rc"
          }
          trap rollback_on_failure EXIT
          npx wrangler deploy --config wrangler.json
          deployed=1
          sleep 3
          for attempt in $(seq 1 12); do
            status=$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/cp-after-health.json -w '%{http_code}' "$PROD_ORIGIN/health") || status=000
            if [[ "$status" == "200" ]] && jq -e '.status=="online" and .policy.experimentalSceneIntelligenceOptIn==true and .policy.experimentalWindowsAssets==11 and .policy.perMoviePauseStopDelete==true and .policy.museOwnsCuts==true and .policy.sceneLabIsolatedQueue==true and .policy.sceneLabMuseV4Export==true and .policy.sceneLabBuild=="cinepulse-scene-lab-v1" and .policy.deepMuseBatches==true and .policy.deepMuseSourceEvidence==true and .policy.deepMuseCheckpoints==true and .policy.deepMuseBuild=="cinepulse-scene-lab-deep-muse-v1" and .policy.deepMuseWindowCandidateBudget==22000 and .policy.permanentDeepMuseDefault==true and .policy.urduAnchorWindowSeconds==25 and .policy.englishAnchorWindowSeconds==12 and .policy.urduTargetedRematchEnabled==true and .policy.audioLanguageQualityForNewProjects==true and .policy.audioLanguageQualityBuild=="cinepulse-v5.4-audio-urdu-qa" and .policy.urduTtsLocaleRequired=="hi-IN" and .policy.urduTtsControlledDevanagari==true and .policy.urduPronunciationBuild=="cinepulse-v5.5-urdu-pronunciation" and .policy.urduCanonicalScript=="Urdu" and .policy.urduTargetedRematchBuild=="cinepulse-urdu-targeted-rematch-v5.2" and .policy.narrationDurationPolicy=="v5.1-strict-for-new-projects" and .policy.productionDeepMuseBuild=="cinepulse-production-muse-deep-v5.0" and .policy.productionDeepMuseBatchSize==5 and .policy.legacySceneLabCreationRetired==true' /tmp/cp-after-health.json >/dev/null; then break; fi
            sleep 3
          done
          [[ "$status" == "200" ]]
          jq -e '.status=="online" and .policy.experimentalSceneIntelligenceOptIn==true and .policy.experimentalWindowsAssets==11 and .policy.perMoviePauseStopDelete==true and .policy.windowsAssetCount==8 and .build=="android-cloud-backend-0.4.3-v3828-cutplan-srt-diagnostics"' and .policy.v5gWorker1Only==true and .policy.v5gLegacyIntPreserved==true and .policy.v5gLiveStageCount==15 /tmp/cp-after-health.json >/dev/null
          no_auth=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$PROD_ORIGIN/v1/projects")
          test "$no_auth" = "401"
          lab_no_auth=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$PROD_ORIGIN/v1/scene-lab")
          test "$lab_no_auth" = "401"
          deep_no_auth=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$PROD_ORIGIN/v1/scene-lab/deep")
          test "$deep_no_auth" = "401"
          deep_post_no_auth=$(curl -sS --max-time 25 -X POST -H 'Content-Type: application/json' --data '{}' -o /dev/null -w '%{http_code}' "$PROD_ORIGIN/v1/scene-lab/deep")
          test "$deep_post_no_auth" = "401"
          echo 'DEEP_MUSE_BATCH_QUEUE_AUTH_PROTECTED_AND_LIVE'
          echo 'PERMANENT_DEEP_MUSE_V5_BILINGUAL_STANDARD_LIVE_HEALTH_VERIFIED'
          echo 'URDU_EVIDENCE_25_SECONDS_NEW_MOVIE_DURATION_CAP_VERIFIED'
          echo 'SCENE_LAB_V4_INT_QUEUE_ENDPOINT_AUTH_PROTECTED_AND_LIVE'
          echo 'PRODUCTION_EXPERIMENT_OPT_IN_AND_MOVIE_PAUSE_STOP_DELETE_AVAILABLE_STABLE_ENDPOINT_ALIVE_AND_AUTH_LOCKED'
          trap - EXIT
      - name: Report active version on success
        if: success()
        shell: bash
        run: |
          curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/cinepulse-android-bridge/deployments" > /tmp/cp-after-deployments.json
          jq -e '.success==true' /tmp/cp-after-deployments.json >/dev/null
          jq -r '[.result.deployments[]?.versions[]? | select(.percentage==100) | .version_id][0] // "MISSING_ACTIVE_VERSION"' /tmp/cp-after-deployments.json | sed 's/^/ACTIVE_CLOUDFLARE_VERSION_ID=/'
          jq -r '.build' /tmp/cp-after-health.json | sed 's/^/ACTIVE_HEALTH_BUILD=/'
          repair_auth=$(curl -sS --max-time 20 -X POST -H 'Content-Type: application/json' --data '{}' -o /dev/null -w '%{http_code}' "$PROD_ORIGIN/v1/projects/eb1333b8-ecbf-4b8a-b1f0-1a9ba75b79d6/deep-muse/rematch-urdu")
          test "$repair_auth" = "401"
          echo 'CINEPULSE_V52_URDU_REPAIR_ROUTE_AUTH_PROTECTED'
          voice_auth=$(curl -sS --max-time 20 -X POST -H 'Content-Type: application/json' --data '{}' -o /dev/null -w '%{http_code}' "$PROD_ORIGIN/v1/projects/eb1333b8-ecbf-4b8a-b1f0-1a9ba75b79d6/audio/urdu-devanagari/resume")
          test "$voice_auth" = "401"
          echo 'CINEPULSE_V55_URDU_DEVANAGARI_RECOVERY_AUTH_PROTECTED'
          echo 'PRODUCTION_PROMOTION_VERIFIED'
