name: CinePulse Android APK
on:
  push:
    branches: [main, 'feature/subtitle-browser-v024']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare Android SDK from runner
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -n "${SDKMANAGER}"
          "${SDKMANAGER}" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Project security checks
        run: python3 tools/verify_source.py
      - name: Android lint, unit tests and debug APK
        run: gradle --no-daemon --stacktrace clean lintDebug testDebugUnitTest assembleDebug
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CinePulse-Android-Galaxy-S9Plus-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
