name: CinePulse Scene Lab Validation
on:
  push:
    branches:
      - feature/scene-lab-ten-strategies
      - feature/scene-lab-muse-deep-batches
      - feature/cinepulse-permanent-deep-muse-v5
      - fix/v5-urdu-anchor-window-and-duration
      - fix/cinepulse-v52-targeted-urdu-rematch
      - fix/cinepulse-v54-audio-urdu-qa-gates
    paths:
      - 'cloudflare/cinepulse-android/src/scene-lab.mjs'
      - 'cloudflare/cinepulse-android/tests/scene-lab.test.mjs'
      - 'cloudflare/cinepulse-android/src/scene-lab-package.mjs'
      - 'cloudflare/cinepulse-android/tests/scene-lab-package.test.mjs'
      - 'cloudflare/cinepulse-android/src/scene-lab-runtime.mjs'
      - 'cloudflare/cinepulse-android/src/scene-lab-deep.mjs'
      - 'cloudflare/cinepulse-android/src/scene-lab-deep-candidates.mjs'
      - 'cloudflare/cinepulse-android/src/permanent-deep-muse.mjs'
      - 'cloudflare/cinepulse-android/src/permanent-deep-rematch.mjs'
      - 'cloudflare/cinepulse-android/tests/permanent-deep-rematch.test.mjs'
      - 'cloudflare/cinepulse-android/src/narration-duration-policy.mjs'
      - 'cloudflare/cinepulse-android/src/audio-urdu-quality.mjs'
      - 'cloudflare/cinepulse-android/tests/audio-urdu-quality.test.mjs'
      - 'cloudflare/cinepulse-android/tests/urdu-anchor-duration-v51.test.mjs'
      - 'cloudflare/cinepulse-android/tests/permanent-deep-muse.test.mjs'
      - 'cloudflare/cinepulse-android/tests/permanent-deep-wiring.test.mjs'
      - 'app/src/main/java/com/cinepulse/mobile/MainActivity.java'
      - 'app/build.gradle'
      - 'cloudflare/cinepulse-android/tests/scene-lab-deep-candidates.test.mjs'
      - 'cloudflare/cinepulse-android/tests/scene-lab-deep.test.mjs'
      - 'cloudflare/cinepulse-android/tools/scene_lab_deep_payload.py'
      - 'cloudflare/cinepulse-android/tests/scene-lab-runtime.test.mjs'
      - 'cloudflare/cinepulse-android/tests/scene-lab-v4.test.mjs'
      - 'cloudflare/cinepulse-android/src/index.mjs'
      - 'cloudflare/cinepulse-android/tools/scene_lab_extract.py'
      - 'cloudflare/cinepulse-android/tests/test_scene_lab_extract.py'
      - '.github/workflows/cinepulse-scene-lab-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/cinepulse-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run backend regression suite
        run: npm test
      - name: Install FFmpeg for mandatory real-audio extraction test
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "FFMPEG_AND_FFPROBE_ALREADY_PRESENT"
          else
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Verify backend and FFmpeg extraction module syntax
        run: |
          node --check src/scene-lab.mjs
          node --check src/scene-lab-package.mjs
          node --check src/scene-lab-runtime.mjs
          node --check src/scene-lab-deep.mjs
          node --check src/scene-lab-deep-candidates.mjs
          node --check src/permanent-deep-muse.mjs
          node --check src/permanent-deep-rematch.mjs
          node --check src/narration-duration-policy.mjs
          node --check src/audio-urdu-quality.mjs
          node --check src/index.mjs
          python3 -m py_compile tools/scene_lab_extract.py
          python3 -m py_compile tools/scene_lab_deep_payload.py
          python3 -m unittest discover -s tests -p 'test_scene_lab_extract.py' -v
