name: CinePulse GitHub runner eligibility probe
on:
  push:
    branches: [feature/scene-intelligence-v3828-staging]
    paths:
      - '.github/workflows/cinepulse-runner-eligibility-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Runner availability — no deployment, no secrets
        run: |
          echo "CINEPULSE_GITHUB_HOSTED_RUNNER_AVAILABLE"
          uname -s
