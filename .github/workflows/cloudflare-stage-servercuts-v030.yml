name: Stage CinePulse v0.3 server cuts and Windows files (NO LIVE TRAFFIC)
on:
  push:
    branches: ['ops/cloudflare-deploy-bridge']
    paths: ['.github/workflows/cloudflare-stage-servercuts-v030.yml']
permissions:
  contents: read
concurrency:
  group: cinepulse-cloudflare-v030
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/cinepulse-android
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CINEPULSE_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CINEPULSE_CF_ACCOUNT_ID }}
      PREVIOUS_VERSION: 4234dfab-f8da-4297-b1f4-03c54d03b61f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run long-form backend QA, syntax and bundle dry-run
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]
          node --check src/index.mjs
          node --test tests/*.test.mjs
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir build-test
          node -e 'const c=require("./wrangler.json");if(c.name!=="cinepulse-android-bridge"||c.keep_vars!==true)throw Error("Wrong Worker configuration");'
      - name: Confirm active production Worker and D1/R2/secret bindings remain unchanged
        run: |
          set -euo pipefail
          mkdir -p stage-proof
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/cinepulse-android-bridge"
          curl -fsS --max-time 50 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/deployments" -o stage-proof/deployments.json
          active=$(jq -r '.result.deployments[0].versions[]|select(.percentage==100)|.version_id' stage-proof/deployments.json)
          if [[ "$active" != "$PREVIOUS_VERSION" ]]; then echo "::error::Production changed ($active). Refusing to stage.";exit 1;fi
          curl -fsS --max-time 50 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/settings" -o stage-proof/settings.json
          jq -e '.result.bindings | any(.name=="DB" and .type=="d1" and .id=="bfcb4e1e-0dab-4816-9f5a-cab22e0b69bd")' stage-proof/settings.json >/dev/null
          jq -e '.result.bindings | any(.name=="FILES" and .type=="r2_bucket" and .bucket_name=="cinepulse-android-assets")' stage-proof/settings.json >/dev/null
          jq -e '.result.bindings | any(.name=="ADMIN_TOKEN" and .type=="secret_text")' stage-proof/settings.json >/dev/null
          jq -e '.result.bindings | any(.name=="DOWNLOAD_SIGNING_KEY" and .type=="secret_text")' stage-proof/settings.json >/dev/null
          echo 'ORIGINAL_WORKER_AND_STORAGE_BINDINGS_VERIFIED'
      - name: Upload an inactive Cloudflare Worker version
        run: |
          set -euo pipefail
          npx wrangler versions upload --tag cinepulse-servercuts-v030 --message "Cloudflare generates final EN/UR timeline and eight Windows assets after Muse scene matching; old jobs preserved."
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/cinepulse-android-bridge"
          curl -fsS --max-time 40 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/versions" -o stage-proof/versions.json
          new=$(jq -r '.result.items[0].id // empty' stage-proof/versions.json)
          test -n "$new" && [[ "$new" != "$PREVIOUS_VERSION" ]]
          echo "$new" > stage-proof/inactive-version.txt
          echo "STAGED_VERSION=$new"
          url="https://${new:0:8}-cinepulse-android-bridge.maryumblog.workers.dev/health"
          verified=0
          for _ in $(seq 1 12);do
            curl -fsS --max-time 35 "$url" -o stage-proof/health.json || true
            if jq -e '.status=="online" and .build=="android-cloud-backend-0.3.0-server-cuts-eight-files" and
              .policy.newMovies=="long_form_only" and .policy.serverCutAllocator==true and .policy.windowsAssetCount==8 and
              .policy.shorts==false and .policy.virals==false and .policy.cutMinSeconds==3 and .policy.cutMaxSeconds==6' stage-proof/health.json >/dev/null 2>&1;then
              verified=1;break
            fi
            sleep 5
          done
          [[ "$verified" == 1 ]] || { echo '::error::Staged preview health did not match';exit 1; }
          echo 'INACTIVE_WORKER_PREVIEW_VERIFIED_NO_TRAFFIC_SWITCH'
      - uses: actions/upload-artifact@v4
        with:
          name: cinepulse-v030-inactive-version
          path: cloudflare/cinepulse-android/stage-proof/inactive-version.txt
          retention-days: 5
