name: CinePulse v0.3 server-owned timeline and Windows export CI
on:
  push:
    branches: ['ops/cloudflare-deploy-bridge']
    paths: ['cloudflare/cinepulse-android/**','.github/workflows/cloudflare-validate-v030.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloudflare/cinepulse-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare Worker module syntax
        run: |
          node --check src/index.mjs
          node --check src/server-cut-planner.mjs
          node --check src/windows-export.mjs
      - name: Run backend-generated timing and package regression tests
        run: node --test tests/*.test.mjs
      - name: Bundle Worker (local-only dry run)
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir .worker-dryrun
